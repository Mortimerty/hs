<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --main-width: 700px;
            /* Настраиваем цвета тени под твой стиль */
            --shadow-color: rgba(139, 92, 246, 0.4); /* Пурпурный */
            --glow-color: rgba(59, 130, 246, 0.3);   /* Синий */
        }

        body {
            background-color: #f3eddd;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 0;
            margin: 0;
        }

        /* Контейнер с тенью */
        .guide-container {
            width: var(--main-width);
            display: flex;
            flex-direction: column;
            /* drop-shadow учитывает прозрачность PNG-картинок */
            filter:
                drop-shadow(0 10px 15px var(--shadow-color))
                drop-shadow(0 0 30px var(--glow-color));
        }

        .scroll-top {
            width: 100%;
            height: 100px;
            background: url('bg-top.png') no-repeat center bottom;
            background-size: 100% 100%;
            margin: 0;
        }

        .scroll-middle {
            width: 100%;
            background: url('bg-middle.png') repeat-y center;
            background-size: 100% auto;
            margin: 0;
            padding: 10px 60px;
            box-sizing: border-box;
            color: #333; /* Поменял на темный, так как фон body светлый */
        }

        .scroll-bottom {
            width: 100%;
            height: 100px;
            background: url('bg-bottom.png') no-repeat center top;
            background-size: 100% 100%;
            margin: 0;
        }

        .content {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="guide-container">
        <div class="scroll-top"></div>

        <div class="scroll-middle">
            <div class="content">
                <h1 style="color: #6e48aa; text-align: center;">Заголовок Гайда</h1>
                <p>К этому блоку применена комбинированная тень: мягкая пурпурная для объема и широкая синяя для эффекта магического свечения.</p>
                <p>Обрати внимание, что <code>filter: drop-shadow</code> наложен на весь контейнер сразу, поэтому тень выглядит как единое целое для всех трех частей фона.</p>
            </div>
        </div>

        <div class="scroll-bottom"></div>
    </div>

</body>
</html>
